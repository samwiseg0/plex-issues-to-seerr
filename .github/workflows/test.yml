name: test

on:
  push:
    # Branches only. A tag push runs the tests through release.yml.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest -q
